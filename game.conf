# Pozor: `name` se sem NEPÍŠE. V game.conf je to deprecated alias pro
# `title` a ContentDB ho výslovně zakazuje.
#
# Identifikátor hry (gameid) se bere z NÁZVU SLOŽKY, ale Luanti z něj utíná
# příponu `_game` — proto má `minetest_game` gameid `minetest`. Složka se
# tedy jmenuje `doggiowars_game` (jméno `doggiowars` je na ContentDB
# obsazené starším modem), zatímco gameid zůstává `doggiowars`.
# Ověřeno: složka bez té přípony si název nechá celý.
title = DoggioWars
author = lioilsources
description = Aerial dogfight over floating voxel islands — you ARE the fighter plane. 12 island biomes, volcanoes and waterfalls, aerobatic tricks, destructible terrain and greyhound races after a golden rabbit. Keyboard + gamepad.
min_minetest_version = 5.12

# Terén staví mapgen.lua sám do prázdného světa — jakýkoli jiný mapgen by
# pod ostrovy nasypal běžnou krajinu. Pole se seedem necháváme viditelné,
# protože seed určuje rozmístění i biomy ostrovů.
default_mapgen = singlenode
allowed_mapgens = singlenode

# Ve hře se nechodí pěšky a nic se needituje — hráč je stíhačka/ponorka.
disabled_settings = creative_mode
