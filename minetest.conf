# Výchozí nastavení pro hru DoggioWars.
# Luanti tenhle soubor načte jako DEFAULTY, když se hraje tahle hra —
# nepřepisuje tím hráčův minetest.conf, jen posouvá výchozí hodnoty.
# Cokoli si hráč nastaví ručně v menu má přednost.

# Gamepad. enable_joysticks je z výroby vypnuté na všech platformách, takže
# bez tohohle řádku ovladač prostě nefunguje a hráč nemá jak uhodnout proč.
enable_joysticks = true

# Enginový default 2048 nechává páčky ujíždět; 4000 sedí na Xbox 360
# i DualShock.
joystick_deadzone = 4000

# joystick_type ZÁMĚRNĚ nenastavujeme — je to vlastnost hardwaru, ne hry.
# "auto" pozná Xbox, DualShock (PS4/PS5) potřebuje ruční "ps5"
# (Nastavení → Ovládání → Gamepady). Viz GAMEPAD.md.

# Hráč je stroj: žádné pěší chození, žádná gravitace na hráči.
# Fyziku si stejně přebíjí vehicle.lua per hráč, tohle je jen základ.
enable_damage = true

# Obloha a dohled — ostrovy jsou daleko od sebe, kratší dohled je schová.
viewing_range = 300
