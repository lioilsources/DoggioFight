# Výchozí nastavení pro hru DoggioWars.
# Luanti tenhle soubor načte jako DEFAULTY, když se hraje tahle hra —
# nepřepisuje tím hráčův minetest.conf, jen posouvá výchozí hodnoty.
# Cokoli si hráč nastaví ručně v menu má přednost.

# Gamepad. enable_joysticks je z výroby vypnuté na všech platformách, takže
# bez tohohle řádku ovladač prostě nefunguje a hráč nemá jak uhodnout proč.
enable_joysticks = true

# Enginový default 2048 nechává páčky ujíždět; 4000 sedí na Xbox 360
# i DualShock.
joystick_deadzone = 4000

# joystick_type ZÁMĚRNĚ nenastavujeme — je to vlastnost hardwaru, ne hry.
# "auto" pozná Xbox, DualShock (PS4/PS5) potřebuje ruční "ps5"
# (Nastavení → Ovládání → Gamepady). Viz GAMEPAD.md.

# Hráč je stroj: žádné pěší chození, žádná gravitace na hráči.
# Fyziku si stejně přebíjí vehicle.lua per hráč, tohle je jen základ.
enable_damage = true

# Obloha a dohled — ostrovy jsou daleko od sebe, kratší dohled je schová.
viewing_range = 300

# Monstra: spawnují se u ostrovů do 200 m od hráče a krouží až 110 m od
# středu ostrova — nejvzdálenější živý tvor je tedy ~310 m daleko. Enginové
# defaulty (active_block_range 4 = 64 m, send range 8 = 128 m) by je smazaly
# dřív, než je hráč uvidí — entity mimo aktivní bloky se (se
# static_save=false) zahazují a neposílají klientovi. 20 bloků = 320 m
# pokrývá i odvrácenou stranu orbitu velkého ostrova.
active_block_range = 20
active_object_send_range_blocks = 20

# Twitch integrace (mod chatbridge) potřebuje HTTP whitelist:
#   secure.http_mods = chatbridge
# TADY to ale nefunguje — Luanti bezpečnostní nastavení z herního configu
# ignoruje ("Secure setting secure.http_mods isn't allowed"), a to záměrně:
# hra si nesmí sama povolit síť. Řádek musí být v minetest.conf HRÁČE
# (Nastavení → Vše → secure) nebo serveru. Viz mods/chatbridge/README.md.
